   <div class="wrapper d-flex align-items-center">
    <div class="logo">
      <img [src]="'kexlogo.png'" alt="Company Logo" class="logo">
    </div>
    <div class="text-center mt-4 mb-4 name">
        <h3>Sign in</h3>
    </div>
 
    <form class="p-3 mt-3" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group form-field">
          <label>Company</label>
          <input type="text" formControlName="company" class="form-control" required />
          <div *ngIf="registerForm.get('company')?.invalid && registerForm.get('company')?.touched" class="text-danger">
            Company name is required.
          </div>
        </div>
    
        <div class="form-group form-field">
          <label>Email Address</label>
          <input type="email" formControlName="email" class="form-control" required />
          <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-danger">
            Enter a valid email address.
          </div>
        </div>
        
        <div class="form-group form-field">
          <label>Full Name</label>
          <input type="text" formControlName="fullName" class="form-control" required />
          <div *ngIf="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched" class="text-danger">
            Full name is required.
          </div>
        </div>
    
        <div class="form-group form-field">
          <label>Phone Number</label>
          <input type="tel" formControlName="phone" class="form-control" required />
          <div *ngIf="registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched" class="text-danger">
            Enter a valid phone number (10-15 digits).
          </div>
        </div>

        <div class="form-group form-field">
          <label>Password</label>
          <input type="password" formControlName="password" class="form-control" required />
          <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-danger">
            Enter a valid Password.
          </div>
        </div>
    
        <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid || submitting">
          {{ submitting ? 'Registering...' : 'Register' }}
        </button>
      </form>
</div>
