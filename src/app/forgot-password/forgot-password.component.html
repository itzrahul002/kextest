<div *ngIf="showForgotPasswordModal" class="modal-overlay" (click)="closeForgotPassword()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <span class="close" (click)="closeForgotPassword()">&times;</span>
        <h3>Forgot Password</h3>
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPassword()">
            <label>Enter your email:</label>
            <input type="email" formControlName="email" required class="form-control">
            <button type="submit" [disabled]="forgotPasswordForm.invalid || forgotSubmitting">
                {{ forgotSubmitting ? 'Sending...' : 'Send Reset Link' }}
            </button>
        </form>
    </div>
</div>

<div [innerHTML]="message"></div>
